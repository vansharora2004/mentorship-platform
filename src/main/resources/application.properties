spring.application.name=mentorship-platform
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/mentorship_platform
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# schema.sql adds the partial unique index Hibernate cannot express; it must run after
# ddl-auto has created the tables.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# HMAC-SHA key material; must be at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Redis backs Spring Cache only. PostgreSQL remains the source of truth; booking
# decisions never read from Redis. Start Redis with: docker compose up -d
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

app.cache.mentor-ttl=10m
app.cache.availability-ttl=2m

# RabbitMQ carries notifications only. Booking correctness never depends on it.
# Start with: docker compose up -d
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
# Local broker default; override with RABBITMQ_PASSWORD anywhere that is not a dev machine.
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2s

# Retry a failing consumer a few times, then stop. requeue-rejected=false is what routes an
# exhausted message to the dead-letter exchange instead of redelivering it forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s

# Scheduler. A session reminder is emitted once per session, this far ahead of its start time.
app.scheduler.reminder-lead-time=15m
app.scheduler.batch-size=100

# Transactional outbox. A notification event is recorded in the same transaction as the operation
# that raised it, then published separately, so a RabbitMQ outage cannot lose it.
# retry-after is a grace period: it keeps the retry job from racing the after-commit publish.
app.outbox.retry-after=1m
app.outbox.batch-size=100
