# Redis and RabbitMQ. PostgreSQL is intentionally NOT containerised - the existing native
# instance stays the source of truth.
#
#   docker compose up -d      start Redis + RabbitMQ
#   docker compose ps         check health
#   docker compose down       stop
#
# RabbitMQ management UI: http://localhost:15672  (guest / guest)
services:
  redis:
    image: redis:7-alpine
    container_name: mentorship-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mentorship-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
